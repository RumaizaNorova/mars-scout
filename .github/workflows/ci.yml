name: CI

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Tests — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest \
            ros2_ws/src/mars_scout_geometry/test/ \
            ros2_ws/src/mars_scout_mock/test/ \
            ros2_ws/src/mars_scout_perception/test/ \
            ros2_ws/src/mars_scout_control/test/ \
            -v --tb=short \
            --cov=ros2_ws/src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: "Lint"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: |
          ruff check ros2_ws/src/ \
            --ignore E501,E402,F401 \
            --exclude "*/test/*,*/__init__.py"
