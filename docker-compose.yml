# ARES containers. See scripts/gpu_host_setup.md.
#
#   bash scripts/smoke_test.sh                     Prove a GPU host works
#   docker compose --profile sim up                Isaac Sim + full ROS stack (NVIDIA GPU)
#   docker compose run --rm mock                   Mock pipeline (no GPU)
#   docker compose run --rm test                   Unit tests (no GPU)
#   docker compose --profile telemetry up -d       Local telemetry

x-ros-build: &ros-build
  context: .
  dockerfile: docker/ros.Dockerfile
  args:
    WITH_TELEMETRY: ${WITH_TELEMETRY:-0}

x-isaac: &isaac
  build:
    context: .
    dockerfile: docker/isaac.Dockerfile
    args:
      ACCEPT_EULA: ${ACCEPT_EULA:-}
  image: ares-isaac:5.1.0
  network_mode: host
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  environment:
    - ACCEPT_EULA=${ACCEPT_EULA:-}
    - PRIVACY_CONSENT=${PRIVACY_CONSENT:-N}
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
  volumes:
    - ${ISAAC_HOME:-~/docker/isaac-sim}/cache/main:/isaac-sim/.cache:rw
    - ${ISAAC_HOME:-~/docker/isaac-sim}/cache/computecache:/isaac-sim/.nv/ComputeCache:rw
    - ${ISAAC_HOME:-~/docker/isaac-sim}/logs:/isaac-sim/.nvidia-omniverse/logs:rw
    - ${ISAAC_HOME:-~/docker/isaac-sim}/config:/isaac-sim/.nvidia-omniverse/config:rw
    - ${ISAAC_HOME:-~/docker/isaac-sim}/data:/isaac-sim/.local/share/ov/data:rw
    - ${ISAAC_HOME:-~/docker/isaac-sim}/pkg:/isaac-sim/.local/share/ov/pkg:rw
    - ${ISAAC_HOME:-~/docker/isaac-sim}/outputs:/opt/ares/outputs:rw
    - ./data:/opt/ares/data:ro

services:

  # ── Isaac Sim (NVIDIA GPU) ───────────────────────────────────────────────
  isaac:
    <<: *isaac
    profiles: [sim]
    command: ["isaac_sim/setup_scene.py"]

  # ── ROS stack ────────────────────────────────────────────────────────────
  ros:
    build: *ros-build
    image: ares-ros:jazzy
    profiles: [sim]
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - MONGODB_URI=${MONGODB_URI:-}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-}
      - ELASTICSEARCH_API_KEY=${ELASTICSEARCH_API_KEY:-}
      - ELASTIC_APM_SERVER_URL=${ELASTIC_APM_SERVER_URL:-}
      - ELASTIC_APM_SECRET_TOKEN=${ELASTIC_APM_SECRET_TOKEN:-}
      - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-http://localhost:6006/v1/traces}
      - ARIZE_API_KEY=${ARIZE_API_KEY:-}
      - ARIZE_SPACE_ID=${ARIZE_SPACE_ID:-}
    command: ["ros2", "launch", "mars_scout_bringup", "full.launch.py"]

  ros-smoke:
    build: *ros-build
    image: ares-ros:jazzy
    profiles: [smoke]
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    command: ["python3", "scripts/smoke_ros.py"]

  # ── No GPU needed ────────────────────────────────────────────────────────
  mock:
    build: *ros-build
    image: ares-ros:jazzy
    profiles: [cpu]
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    volumes:
      - mars_images:/opt/ares/ros2_ws/src/mars_scout_mock/data
    command: ["ros2", "launch", "mars_scout_bringup", "mock.launch.py"]

  test:
    build: *ros-build
    image: ares-ros:jazzy
    profiles: [cpu]
    command: ["bash", "scripts/run_tests.sh"]

  # ── Local telemetry (no cloud accounts needed) ───────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    profiles: [telemetry]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    profiles: [telemetry]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy

  phoenix:
    image: arizephoenix/phoenix@sha256:1f9a144a5357b4973e93a15718f050247cb7a4ee7b7c6c06ecb91b5eed3fbaad
    profiles: [telemetry]
    ports:
      - "6006:6006"
      - "4317:4317"   # OTLP gRPC
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data

volumes:
  mars_images:
  es_data:
  phoenix_data:
